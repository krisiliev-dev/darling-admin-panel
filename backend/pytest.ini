# -*- coding: utf-8 -*-
# Pytest config for the admin-panel backend test suite.
# Run from this directory:  python -m pytest -q
[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: opt-in live-integration suite (real Barsy/couriers/nekorekten); run with RUN_INTEGRATION=1
filterwarnings =
    ignore::DeprecationWarning
