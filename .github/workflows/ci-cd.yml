name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger — lets a deploy be re-run without inventing a commit (e.g. to verify the pipeline
  # after server-side changes like the SSH hardening on 2026-07-30). Note the `deploy` job's `if:`
  # must accept this event too, or a manual run would pass CI and silently skip the deploy.
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint
      - name: Typecheck + build (tsc -b && vite build)
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E tests (browser emulator — real UI, mocked API)
        working-directory: frontend
        run: npx playwright test

  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check .
      - name: Type check (mypy)
        working-directory: backend
        run: python -m mypy app
      - name: Tests + coverage gate
        working-directory: backend
        # darling_core falls back to darling_core/_vendor (no agent-pipeline sibling in CI);
        # --timeout guards against a hang (no creds on the runner → external calls fail fast).
        # --cov-fail-under floors coverage so a change can't silently drop it.
        run: python -m pytest -q --timeout=120 --cov=app --cov-report=term-missing --cov-fail-under=70

  deploy:
    needs: [frontend-ci, backend-ci]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server over SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'bash /home/darling/product-review/admin-panel/deploy.sh'
