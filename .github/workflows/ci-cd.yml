name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger — lets a deploy be re-run without inventing a commit (e.g. to verify the pipeline
  # after server-side changes like the SSH hardening on 2026-07-30). Note the `deploy` job's `if:`
  # must accept this event too, or a manual run would pass CI and silently skip the deploy.
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint
      - name: Typecheck + build (tsc -b && vite build)
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        working-directory: frontend
        run: npx vitest run
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E tests (browser emulator — real UI, mocked API)
        working-directory: frontend
        run: npx playwright test

  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check .
      - name: Type check (mypy)
        working-directory: backend
        run: python -m mypy app
      - name: Tests + coverage gate
        working-directory: backend
        # darling_core falls back to darling_core/_vendor (no agent-pipeline sibling in CI);
        # --timeout guards against a hang (no creds on the runner → external calls fail fast).
        # --cov-fail-under floors coverage so a change can't silently drop it.
        run: python -m pytest -q --timeout=120 --cov=app --cov-report=term-missing --cov-fail-under=70

  deploy:
    needs: [frontend-ci, backend-ci]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server over SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # PINNED host key, not ssh-keyscan. Scanning on every run is trust-on-first-use EVERY time:
          # the runner would accept whatever answered on port 22, and this step then ships a container
          # that reads a .env full of live Barsy + courier credentials. The pin makes a MITM fail loudly.
          # ⚠ If the box is rebuilt or its host keys are regenerated, deploys will fail with a host-key
          # mismatch. That is CORRECT — do not "fix" it by restoring ssh-keyscan. Get the new key from
          # the server itself (`ssh-keyscan` run ON the box, or /etc/ssh/ssh_host_ed25519_key.pub) and
          # update the SERVER_SSH_HOST_KEY secret. The value may list several host forms, one per line.
          printf '%s\n' "${{ secrets.SERVER_SSH_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            'bash /home/darling/product-review/admin-panel/deploy.sh'

      # POST-DEPLOY SMOKE CHECK. CI itself cannot run this: the runner has no ../agent-pipeline sibling
      # and therefore no real catalogue, so the tests that would catch a broken data root are skipped
      # there. Only the deployed app has the data, which makes this the one place the check is real.
      #
      # Added after a change passed 979 tests and CI, deployed green, reported "healthy", and left
      # production unable to query its own catalogue. A deploy that reports success while the app cannot
      # read its data is precisely the failure this task exists to close.
      - name: Verify the deployed app can read its catalogue
        run: |
          sleep 15
          BODY=$(curl -sS --max-time 30 https://panel.darlinghome.bg/api/health)
          echo "$BODY"
          python3 - "$BODY" <<'PY'
          import json, sys
          d = json.loads(sys.argv[1])
          bad = []
          if d.get("db") != "ok":
              bad.append(f'db={d.get("db")!r}')
          if not (d.get("db_products") or 0) > 0:
              bad.append(f'db_products={d.get("db_products")!r} (data root wrong?)')
          if d.get("core_drift"):
              bad.append(f'core_drift={[x.get("module") for x in d["core_drift"]]} '
                         '(running shared-core code the deploy did not carry)')
          if bad:
              print("::error::deployed app unhealthy: " + "; ".join(bad))
              sys.exit(1)
          print(f'ok — db reachable, {d["db_products"]} products, no core drift')
          PY
